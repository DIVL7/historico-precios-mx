name: Actualizar precios de medicamentos

on:
  workflow_dispatch:
    inputs:
      anio:
        description: 'Año del archivo de Contratos a descargar'
        required: false
        default: ''
  # Cron pendiente de definir (frecuencia por decidir). Ejemplo para correr
  # cada lunes 06:00 UTC, descomentar cuando se decida la cadencia:
  # schedule:
  #   - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Playwright
        run: npx playwright install chromium --with-deps

      - name: Descargar CSV del año
        run: node scripts/download-csv.js ${{ inputs.anio }}

      - name: Correr pipeline de extracción
        run: |
          YEAR="${{ inputs.anio }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          node scripts/extract.js "data/raw/contratos_${YEAR}.csv" --out docs/data.json --concurrency 4

      - name: Validar claves (sanity check post-extracción)
        # Corre aunque el paso anterior se haya cortado por timeout -- sigue
        # habiendo valor en validar lo que sí se alcanzó a extraer. Si
        # docs/data.json no existe todavía (primera corrida sin progreso),
        # este paso falla solo -- no debe bloquear el commit de lo que sí haya.
        if: always()
        continue-on-error: true
        run: node scripts/validar-claves.js

      - name: Commitear resultado
        # Corre incluso si el paso de extracción se cortó por el timeout del
        # job o falló a medio camino. El pipeline escribe docs/data.json de
        # forma incremental (cada 10 expedientes), así que aunque no haya
        # terminado, hay progreso real que vale la pena guardar -- y
        # docs/data.errores.json es necesario para que la siguiente corrida
        # sepa qué reintentar en vez de reprocesar todo desde cero.
        if: always()
        run: |
          # Solo se versiona docs/ (los resultados). El CSV crudo descargado
          # (decenas de MB, se re-descarga fresco en cada corrida) no se commitea
          # para no inflar el historial del repo.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/data.json docs/data.errores.json docs/data.calidad.json docs/data.correcciones.json docs/data.xlsx; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualización automática de precios ($(date +%Y-%m-%d))"
          git push
